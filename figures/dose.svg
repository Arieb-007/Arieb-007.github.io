<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Schematic of the affine law: each unit's response is a straight line in the intervention strength lambda.">
  <style>
    text{font-family:"Times New Roman",Times,serif;font-size:13px;fill:#222}
    .m{font-style:italic;font-size:15px}
    .ax{stroke:#222;stroke-width:1}
    .b{stroke:#1f4e9c;stroke-width:2.2;fill:none}
    .r{stroke:#b4343c;stroke-width:2.2;fill:none}
    .ob{fill:#fff;stroke:#1f4e9c;stroke-width:1.6}
    .or{fill:#fff;stroke:#b4343c;stroke-width:1.6}
  </style>
  <rect width="480" height="300" fill="#fff"/>
  <!-- axes -->
  <line class="ax" x1="60" y1="150" x2="440" y2="150"/>
  <line class="ax" x1="60" y1="40" x2="60" y2="262"/>
  <line x1="250" y1="40" x2="250" y2="262" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="60" y="280" text-anchor="middle">−1</text>
  <text x="250" y="280" text-anchor="middle">0</text>
  <text x="440" y="280" text-anchor="middle">1</text>
  <text class="m" x="455" y="155">λ</text>
  <text class="m" x="46" y="32" text-anchor="end">E<tspan font-size="11" baseline-shift="sub">r</tspan>(λ)</text>
  <!-- units: y = 150 - (own + γλ)·95 ; λ∈[-1,1] ↦ x∈[60,440] -->
  <line class="b" x1="60" y1="55"  x2="440" y2="140"/>
  <line class="b" x1="60" y1="69"  x2="440" y2="202"/>
  <line class="b" x1="60" y1="140" x2="440" y2="197"/>
  <line class="r" x1="60" y1="164" x2="440" y2="69"/>
  <line class="r" x1="60" y1="221" x2="440" y2="164"/>
  <circle class="ob" cx="250" cy="97.5" r="4"/>
  <circle class="ob" cx="250" cy="135.5" r="4"/>
  <circle class="ob" cx="250" cy="168.5" r="4"/>
  <circle class="or" cx="250" cy="116.5" r="4"/>
  <circle class="or" cx="250" cy="192.5" r="4"/>
  <!-- legend -->
  <line class="b" x1="300" y1="228" x2="324" y2="228"/><text x="330" y="232">γ<tspan font-size="10" baseline-shift="sub">r</tspan> &lt; 0, counterweight</text>
  <line class="r" x1="300" y1="246" x2="324" y2="246"/><text x="330" y="250">γ<tspan font-size="10" baseline-shift="sub">r</tspan> &gt; 0, reinforcer</text>
</svg>
