<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Schematic: a text environment where an agent moves through the steps of an everyday activity, choosing among options at each step; wrong choices cost a point, completing the task earns ten.">
  <style>
    .bg{fill:#e8ecf0}.ink{stroke:#17202b}.inkf{fill:#17202b}.mut{stroke:#8a94a1}.mutf{fill:#8a94a1}
    .blue{stroke:#2c66ae}.bluef{fill:#2c66ae}.red{stroke:#b4343c}.redf{fill:#b4343c}
    .redw{fill:#b4343c;fill-opacity:.12}.bluew{fill:#2c66ae;fill-opacity:.12}
    .open{fill:#e8ecf0}
    text{font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;font-size:12px;fill:#56606d}
    .lab{font-family:Newsreader,"Iowan Old Style",Georgia,serif;font-style:italic;font-size:15px;fill:#17202b}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a2029}.ink{stroke:#e4e8ed}.inkf{fill:#e4e8ed}.mut{stroke:#6b7682}.mutf{fill:#6b7682}
      .blue{stroke:#74a6e2}.bluef{fill:#74a6e2}.red{stroke:#e57d84}.redf{fill:#e57d84}
      .redw{fill:#e57d84;fill-opacity:.14}.bluew{fill:#74a6e2;fill-opacity:.14}.open{fill:#1a2029}
      text{fill:#9aa4b1}.lab{fill:#e4e8ed}
    }
  </style>
  <!-- spine of steps -->
  <g class="ink" stroke-width="2" fill="none">
    <path d="M40 150 L110 150 L180 150 L250 150 L320 150 L360 150"/>
  </g>
  <!-- choices at each step: a fan of options, one taken -->
  <g class="mut" stroke-width="1.3" fill="none">
    <path d="M110 150 L150 100 M110 150 L150 200"/>
    <path d="M180 150 L220 110 M180 150 L220 190 M180 150 L222 220"/>
    <path d="M250 150 L290 105 M250 150 L290 195"/>
  </g>
  <g class="open mut" stroke-width="1.3">
    <circle cx="150" cy="100" r="4"/><circle cx="150" cy="200" r="4"/>
    <circle cx="220" cy="110" r="4"/><circle cx="220" cy="190" r="4"/><circle cx="222" cy="220" r="4"/>
    <circle cx="290" cy="105" r="4"/><circle cx="290" cy="195" r="4"/>
  </g>
  <g class="inkf">
    <circle cx="40" cy="150" r="6"/><circle cx="110" cy="150" r="6"/><circle cx="180" cy="150" r="6"/>
    <circle cx="250" cy="150" r="6"/><circle cx="320" cy="150" r="6"/>
  </g>
  <!-- a wrong turn taken then corrected -->
  <path class="red" fill="none" stroke-width="2" d="M180 150 L220 190"/>
  <circle class="redf" cx="220" cy="190" r="4.5"/>
  <text class="redf" x="232" y="194">−1</text>
  <!-- completion -->
  <circle class="bluef" cx="360" cy="150" r="7"/>
  <text class="bluef" x="360" y="128" text-anchor="middle">+10</text>
  <!-- step labels -->
  <text x="40" y="180" text-anchor="middle">start</text>
  <text x="110" y="180" text-anchor="middle">step 1</text>
  <text x="180" y="180" text-anchor="middle">step 2</text>
  <text x="250" y="180" text-anchor="middle">step 3</text>
  <text x="320" y="180" text-anchor="middle">…</text>
  <text class="lab" x="200" y="60" text-anchor="middle">“Baking a cake”</text>
  <text x="200" y="80" text-anchor="middle">a script, read as a decision graph</text>
  <text x="200" y="262" text-anchor="middle">pick the next step from 2–5 text options</text>
</svg>
